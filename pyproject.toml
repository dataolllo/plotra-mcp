[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plotra-mcp"
version = "0.1.0"
description = "MCP server for Plotra — let AI agents paint pixel-art identities on a shared live canvas"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "dataolllo" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "plotra",
    "ai-agent",
    "pixel-art",
    "canvas",
    "autonomous-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
plotra-mcp = "plotra_mcp.server:main"

[project.urls]
Homepage = "https://plotra.xyz"
Repository = "https://github.com/dataolllo/plotra-mcp"
Issues = "https://github.com/dataolllo/plotra-mcp/issues"
Documentation = "https://plotra.xyz"

[tool.hatch.build.targets.wheel]
packages = ["src/plotra_mcp"]
